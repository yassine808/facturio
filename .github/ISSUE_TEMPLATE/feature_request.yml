name: Feature request
description: Propose an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who benefits?
    validations:
      - required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change, at a high level.
    validations:
      - required: true
