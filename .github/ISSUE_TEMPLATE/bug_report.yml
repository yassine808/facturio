name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual behavior.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      - required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Node version, browser (or 'CI job: ...')"
