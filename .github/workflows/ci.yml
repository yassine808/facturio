name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      # fetch-depth: 0 is REQUIRED — gitleaks (check 6/9) scans a commit range
      # that starts before HEAD; a shallow clone doesn't have those objects.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # 1/9 — lint
      - name: "Check 1/9: ESLint"
        run: pnpm lint

      # 2/9 — types
      - name: "Check 2/9: TypeScript (strict, noEmit)"
        run: pnpm typecheck

      # 3/9 — unit tests (domain logic)
      - name: "Check 3/9: Unit tests (Vitest)"
        run: pnpm test

      # 4/9 — project env/secret hygiene (no .env tracked, env documented, no key patterns)
      - name: "Check 4/9: Env & secret hygiene"
        run: pnpm check:env

      # 5/9 — dependency vulnerabilities
      - name: "Check 5/9: Dependency audit"
        run: pnpm audit --prod

      # 6/9 — dedicated secret scan (independent second layer vs check 4)
      - name: "Check 6/9: Gitleaks secret scan"
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENT: false

      # 7/9 — database: migrations from scratch + RLS (pgTAP) tests
      - name: "Check 7/9: Supabase up + migrations from scratch"
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Apply all migrations + seed
        run: supabase db reset

      - name: "RLS / DB tests (pgTAP)"
        run: pnpm test:db

      - name: Export local Supabase env for the app
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          . /tmp/supabase.env
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL:-http://127.0.0.1:54321}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } > .env.local
          echo "env.local keys: $(cut -d= -f1 .env.local | tr '\n' ' ')"

      # 8/9 — production build
      - name: "Check 8/9: Next.js production build"
        run: pnpm build

      # 9/9 — e2e + accessibility
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: "Check 9/9: E2E + axe accessibility"
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
